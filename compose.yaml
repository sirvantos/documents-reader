# Run the whole test suite in containers:
#     docker compose run --rm tests
# Extra pytest arguments go at the end, e.g. `docker compose run --rm tests -k note -x`.
# Stop the database afterwards with `docker compose down`.
#
# Static checks (ruff and mypy; no database, no network):
#     docker compose run --rm lint
#
# Only synthetic files generated by the tests are used; no data folder is mounted.
name: docreader-tests

services:
  db:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 with the vector extension (feature 07, R-10)
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust  # reachable only from the tests container
    tmpfs:
      - /var/lib/postgresql/data  # throwaway: nothing survives `docker compose down`
    networks:
      - isolated
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: docker/tests.Dockerfile
    # Share the database container's network namespace: the database is on
    # localhost, which the local-database guard accepts, and there is no route
    # to the outside (the network is internal).
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOCREADER_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # The recognition engine never runs on this server or in Docker (research R-4).
      DOCREADER_FORBID_MODELS: "1"
    volumes:
      - .:/app:ro

  lint:
    build:
      context: .
      dockerfile: docker/tests.Dockerfile
    network_mode: none
    entrypoint: ["sh", "-c"]
    command: ["/opt/venv/bin/ruff check . && /opt/venv/bin/mypy"]
    environment:
      # The repository is mounted read-only: keep tool caches out of it.
      RUFF_NO_CACHE: "true"
      MYPY_CACHE_DIR: /tmp/mypy
      DOCREADER_FORBID_MODELS: "1"
    volumes:
      - .:/app:ro

networks:
  isolated:
    internal: true
