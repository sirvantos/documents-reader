[project]
name = "docreader"
version = "0.1.0"
description = "Local PoC: reading, field extraction, search and answers over Russian contracts"
requires-python = ">=3.11"
dependencies = [
    "pypdfium2",
    "psycopg[binary]>=3.2",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "pillow",
]

[project.scripts]
docreader = "docreader.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "reportlab",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a local PostgreSQL (DOCREADER_TEST_DATABASE_URL)",
    "real_model: needs a real model, run only on the analyst's Mac",
]
addopts = "-m 'not real_model'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "RUF"]
# Cyrillic text in strings, docstrings and comments is intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Libraries shipped without type information.
module = ["pypdfium2", "pypdfium2.*", "pymorphy3", "pymorphy3.*"]
ignore_missing_imports = true
